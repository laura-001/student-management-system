
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .shadow-level-1 {
            box-shadow: 0px 2px 13px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="bg-white rounded-xl shadow-level-1 p-8 w-[380px]">

        <!-- Logo -->
        <div class="flex flex-col items-center text-center mb-6">

            <div class="bg-blue-900 rounded-lg w-20 h-20 flex items-center justify-center mb-3">
                <img src="../assets/images/logo.png"
                     alt="Logo"
                     class="w-full h-full object-contain p-2">
            </div>

            <h1 class="text-2xl font-semibold text-blue-900">
                Reset Password
            </h1>

            <p class="text-gray-500 mt-2 text-sm">
                Enter your email address and we'll send a password reset link.
            </p>

        </div>

        <!-- Form -->
        <form>

            <div class="mb-4">
                <label class="block text-sm font-semibold uppercase mb-2">
                    Email Address
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    class="w-full border border-gray-300 rounded-lg px-3 py-3 focus:outline-none focus:ring-1 focus:ring-blue-900">
            </div>

            <button
                type="submit"
                class="w-full bg-blue-900 text-white rounded-lg py-3 font-semibold hover:opacity-90 transition">
                Send Reset Link
            </button>

        </form>

        <!-- Back to Login -->
        <div class="mt-6 pt-4 border-t text-center">
            <a href="login.html"
               class="text-blue-900 font-medium hover:underline">
                Back to Sign In
            </a>
        </div>

    </div>

</body>
</html>
