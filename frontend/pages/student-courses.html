<script>
        const courseList = document.getElementById('course-list');
        const courseSearch = document.getElementById('course-search');
        const departmentFilter = document.getElementById('department-filter');
        const yearFilter = document.getElementById('year-filter');
        const semesterFilter = document.getElementById('semester-filter');
        const clearFiltersButton = document.getElementById('clear-filters');
        const courseResultCount = document.getElementById('course-result-count');
        let allCourses = [];

        const courseButton = (course) => {
            if (course.is_registered) {
                return '<button class="w-full md:w-auto px-lg py-sm bg-secondary-container text-on-secondary-container rounded font-headline-sm cursor-default" disabled>Registered</button>';
            }
            if (course.available_slots <= 0) {
                return `<button class="w-full md:w-auto px-lg py-sm bg-surface border border-primary text-primary rounded font-headline-sm hover:bg-primary/5 transition-colors" data-course-id="${course.id}" data-registration-status="waitlisted">Join Waitlist</button>`;
            }
            return `<button class="w-full md:w-auto px-lg py-sm bg-primary text-on-primary rounded font-headline-sm hover:bg-primary-container transition-colors" data-course-id="${course.id}" data-registration-status="active">Register</button>`;
        };

        const renderCourses = (courses) => {
            if (!courseList) {
                return;
            }

            if (courseResultCount) {
                courseResultCount.textContent = `Showing ${courses.length} course${courses.length === 1 ? '' : 's'} from the database`;
            }

            if (!courses.length) {
                courseList.innerHTML = '<div class="p-md text-on-surface-variant">No matching courses found.</div>';
                return;
            }

            courseList.innerHTML = courses.map((course, index) => `
                <div class="flex flex-col md:flex-row items-center justify-between p-md gap-md ${index < courses.length - 1 ? 'border-b border-outline-variant' : ''} hover:bg-surface-container-low transition-colors">
                    <div class="flex flex-col md:flex-row items-start md:items-center gap-md flex-grow">
                        <span class="bg-primary-fixed text-on-primary-fixed px-xs py-1 rounded text-label-md font-bold shrink-0">${escapeHtml(course.course_code)}</span>
                        <div class="flex flex-col">
                            <h4 class="text-headline-sm font-bold text-on-surface">${escapeHtml(course.course_name)}</h4>
                            <p class="text-body-sm text-outline">${escapeHtml(course.credit_units)} units | Year ${escapeHtml(course.year_of_study)} | Semester ${escapeHtml(course.semester)} | ${escapeHtml(course.available_slots)} slots available</p>
                        </div>
                    </div>
                    <div class="shrink-0 w-full md:w-auto">
                        ${courseButton(course)}
                    </div>
                </div>
            `).join('');
        };

        const populateDepartmentOptions = (courses) => {
            if (!departmentFilter) {
                return;
            }

            const currentValue = departmentFilter.value;
            const departments = [...new Set(
                courses
                    .map((course) => (course.department || '').trim())
                    .filter(Boolean)
            )].sort((left, right) => left.localeCompare(right));

            departmentFilter.innerHTML = ['<option value="">All departments</option>']
                .concat(departments.map((department) => `<option value="${escapeHtml(department)}">${escapeHtml(department)}</option>`))
                .join('');

            if (departments.includes(currentValue)) {
                departmentFilter.value = currentValue;
            }
        };

        const filterCourses = () => {
            const query = (courseSearch?.value || '').trim().toLowerCase();
            const selectedDepartment = (departmentFilter?.value || '').trim();
            const selectedYear = (yearFilter?.value || '').trim();
            const selectedSemester = (semesterFilter?.value || '').trim();

            const visibleCourses = allCourses.filter((course) => {
                const matchesSearch = (
                    course.course_code.toLowerCase().includes(query)
                    || course.course_name.toLowerCase().includes(query)
                );
                const matchesDepartment = !selectedDepartment || (course.department || '').trim() === selectedDepartment;
                const matchesYear = !selectedYear || String(course.year_of_study) === selectedYear;
                const matchesSemester = !selectedSemester || String(course.semester) === selectedSemester;

                return matchesSearch && matchesDepartment && matchesYear && matchesSemester;
            });

            renderCourses(visibleCourses);
        };

        const loadCourses = async () => {
            try {
                await requireStudentSession();
                const data = await apiRequest('/courses');
                allCourses = data.courses || [];
                populateDepartmentOptions(allCourses);
                filterCourses();
            } catch (error) {
                if (courseList) {
                    courseList.innerHTML = `<div class="p-md text-error">${escapeHtml(error.message)}</div>`;
                }
            }
        };

        courseSearch?.addEventListener('input', filterCourses);
        departmentFilter?.addEventListener('change', filterCourses);
        yearFilter?.addEventListener('change', filterCourses);
        semesterFilter?.addEventListener('change', filterCourses);

        clearFiltersButton?.addEventListener('click', () => {
            if (courseSearch) {
                courseSearch.value = '';
            }
            if (departmentFilter) {
                departmentFilter.value = '';
            }
            if (yearFilter) {
                yearFilter.value = '';
            }
            if (semesterFilter) {
                semesterFilter.value = '';
            }
            filterCourses();
        });

        courseList?.addEventListener('click', async (event) => {
            const button = event.target.closest('[data-course-id]');
            if (!button) {
                return;
            }

            const courseId = button.getAttribute('data-course-id');
            const registrationStatus = button.getAttribute('data-registration-status') || 'active';
            button.disabled = true;
            button.textContent = 'Processing...';

            try {
                await apiRequest(`/students/me/registrations/${courseId}`, {
                    method: 'POST',
                    body: JSON.stringify({ status: registrationStatus }),
                });
                await loadCourses();
            } catch (error) {
                button.disabled = false;
                button.textContent = registrationStatus === 'waitlisted' ? 'Join Waitlist' : 'Register';
                alert(error.message);
            }
        });

        const logoutModal = document.getElementById('logout-modal');
        const logoutCancel = document.getElementById('logout-cancel');
        const logoutConfirm = document.getElementById('logout-confirm');
        const logoutTriggers = document.querySelectorAll('[data-logout-trigger]');

        const openLogoutModal = (event) => {
            event.preventDefault();
            if (!logoutModal) {
                return;
            }
            logoutModal.classList.remove('hidden');
        };

        const closeLogoutModal = () => {
            if (!logoutModal) {
                return;
            }
            logoutModal.classList.add('hidden');
        };

        logoutTriggers.forEach((trigger) => {
            trigger.addEventListener('click', openLogoutModal);
        });

        if (logoutCancel) {
            logoutCancel.addEventListener('click', closeLogoutModal);
        }

        if (logoutConfirm) {
            logoutConfirm.addEventListener('click', () => {
                clearAuthSession();
                window.location.href = 'login.html';
            });
        }

        if (logoutModal) {
            logoutModal.addEventListener('click', (event) => {
                if (event.target === logoutModal) {
                    closeLogoutModal();
                }
            });
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeLogoutModal();
            }
        });

        loadCourses();
    </script>
