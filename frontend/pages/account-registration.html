<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration - University Academic Portal</title>

    <!-- Material Symbols icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Tailwind theme configuration -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#002869",
                        "primary-container": "#0b3d91",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#144296",
                        background: "#f6f9ff",
                        "on-background": "#151c22",
                        surface: "#f6f9ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container": "#e8eef7",
                        "surface-variant": "#dce3ec",
                        "on-surface": "#151c22",
                        "on-surface-variant": "#434652",
                        outline: "#747783",
                        "outline-variant": "#c4c6d3",
                        error: "#ba1a1a",
                        "error-container": "#ffdad6"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    spacing: {
                        xs: "8px",
                        sm: "13px",
                        md: "21px",
                        lg: "34px",
                        xl: "55px",
                        margin: "34px"
                    },
                    fontFamily: {
                        "body-lg": ["Inter", "sans-serif"],
                        "headline-sm": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"]
                    },
                    fontSize: {
                        "body-lg": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
                        "body-sm": ["10px", { lineHeight: "1.6", fontWeight: "400" }],
                        "headline-sm": ["16px", { lineHeight: "1.5", fontWeight: "600" }],
                        "headline-md": ["26px", { lineHeight: "1.3", fontWeight: "600" }],
                        "headline-lg": ["42px", { lineHeight: "1.2", fontWeight: "600" }],
                        "label-md": ["10px", { lineHeight: "1.0", letterSpacing: "0.05em", fontWeight: "600" }]
                    },
                    boxShadow: {
                        "level-1": "0px 2px 13px rgba(0,0,0,0.05)"
                    }
                }
            }
        };
    </script>

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg relative overflow-x-hidden">

    <!-- Decorative background image.-->
    <div
        class="absolute inset-0 z-0 bg-cover bg-center opacity-40 mix-blend-multiply"
        style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBSqIC9chw1vPjfkGqzyI-IMh6yHDi9y2eY33HN0vEGLhBM1hyv3K5cmhnRBSQz2Toa3t0kXDPEwH3XshkDR1nlbR0thGMeGXSPkw4_jQkEDQRN0b-_iRFnmqNRt3KUf23Q2Y7sLrcvTnxig6UYFMfR8cS4OZsoFfvjt-x-lxGK6WhEtQ315PMEVmJp2iI5y-4LWH79yJjqthnGzQvMI-mSxsPfqb1R0KrifeUBMnMgWAieaI0aayT7MSXklY64D6-PRLhhGSqvXtM');">
    </div>

    <!-- Page header -->
    <header class="relative z-10 w-full py-margin px-margin flex justify-center lg:justify-start">
        <div class="flex items-center gap-xs">
            <span class="material-symbols-outlined text-primary text-[32px]">school</span>
            <h1 class="font-headline-md text-headline-md text-primary">
                University Academic Portal
            </h1>
        </div>
    </header>

    <!-- Main page content -->
    <main class="relative z-10 flex-grow flex items-center justify-center p-margin w-full max-w-[1140px] mx-auto">
        <div class="w-full max-w-4xl bg-surface-container-lowest rounded-xl shadow-level-1 p-xl border-t-2 border-primary">

            <!-- Page introduction -->
            <div class="mb-xl text-center md:text-left">
                <h1 class="font-headline-lg text-headline-lg text-primary mb-xs">
                    University Account Registration
                </h1>
                <p class="font-body-lg text-body-lg text-on-surface-variant">
                    Register securely to access courses, dashboards, and academic services.
                </p>
            </div>

            <!-- Alert message area. -->
            <div id="messageBox" class="hidden mb-md p-sm rounded border text-sm"></div>

            <!--
                IMPORTANT:
                The form no longer submits directly using a normal HTML action.
                JavaScript intercepts the submit event and sends JSON to FastAPI.
            -->
            <form id="registerForm" class="grid grid-cols-1 md:grid-cols-2 gap-x-xl gap-y-lg" novalidate>

                <!-- full_name maps directly to users.full_name -->
                <div class="flex flex-col gap-xs md:col-span-2">
                    <label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="full_name">
                        Full Legal Name
                    </label>
                    <input
                        id="full_name"
                        name="full_name"
                        type="text"
                        placeholder="e.g. Jane Doe"
                        required
                        minlength="2"
                        maxlength="100"
                        class="w-full px-md py-sm border border-outline-variant rounded bg-surface-container-lowest focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-lg text-body-lg text-on-surface placeholder:text-outline" />
                </div>

                <!-- email maps directly to users.email and must be unique in the database -->
                <div class="flex flex-col gap-xs md:col-span-2">
                    <label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="email">
                        University Email
                    </label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="username@university.edu"
                        required
                        maxlength="100"
                        class="w-full px-md py-sm border border-outline-variant rounded bg-surface-container-lowest focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-lg text-body-lg text-on-surface placeholder:text-outline" />
                    <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">
                        This email will be used for login and must be unique.
                    </p>
                </div>

                <!-- password is NOT stored directly. Backend hashes it into users.password_hash. -->
                <div class="flex flex-col gap-xs relative">
                    <label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="password">
                        Create Password
                    </label>
                    <div class="relative">
                        <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="••••••••"
                            required
                            minlength="8"
                            class="w-full pl-md pr-xl py-sm border border-outline-variant rounded bg-surface-container-lowest focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-lg text-body-lg text-on-surface" />

                        <!-- Password visibility toggle button -->
                        <button
                            id="togglePassword"
                            type="button"
                            class="absolute inset-y-0 right-0 pr-sm flex items-center text-outline hover:text-primary transition-colors focus:outline-none">
                            <span class="material-symbols-outlined" id="toggleIcon">visibility_off</span>
                        </button>
                    </div>
                    <p class="font-body-sm text-body-sm text-on-surface-variant mt-1">
                        Use at least 8 characters.
                    </p>
                </div>

                <!-- confirmPassword . -->
                <div class="flex flex-col gap-xs">
                    <label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="confirmPassword">
                        Confirm Password
                    </label>
                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        placeholder="••••••••"
                        required
                        minlength="8"
                        class="w-full px-md py-sm border border-outline-variant rounded bg-surface-container-lowest focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-lg text-body-lg text-on-surface" />
                </div>

               
                <input id="role" name="role" type="hidden" value="student" />


                <!-- Submit button and login link -->
                <div class="md:col-span-2 flex flex-col items-center gap-md mt-sm pt-lg border-t border-surface-variant">
                    <button
                        id="submitBtn"
                        type="submit"
                        class="w-full md:w-auto min-w-[240px] bg-primary text-on-primary rounded font-headline-sm text-headline-sm py-sm px-margin hover:bg-on-primary-fixed-variant transition-colors shadow-sm focus:ring-2 focus:ring-offset-2 focus:ring-primary flex items-center justify-center gap-xs">
                        <span id="submitText">Create account</span>
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                    </button>

                    <p class="font-body-lg text-body-lg text-on-surface-variant">
                        Already have an account?
                        <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-2 transition-all" href="login.html">
                            Sign in here
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </main>

    <script>
   
        const API_BASE_URL = "http://127.0.0.1:8000";

        document.addEventListener("DOMContentLoaded", () => {
            const registerForm = document.getElementById("registerForm");
            const messageBox = document.getElementById("messageBox");
            const submitBtn = document.getElementById("submitBtn");
            const submitText = document.getElementById("submitText");

            const fullNameInput = document.getElementById("full_name");
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const confirmPasswordInput = document.getElementById("confirmPassword");
            const roleInput = document.getElementById("role");

            const togglePassword = document.getElementById("togglePassword");
            const toggleIcon = document.getElementById("toggleIcon");

            /* Password visibility toggle */
            togglePassword.addEventListener("click", () => {
                const isPassword = passwordInput.type === "password";
                passwordInput.type = isPassword ? "text" : "password";
                toggleIcon.textContent = isPassword ? "visibility" : "visibility_off";
            });

            /* Helper function for showing success/error messages */
            function showMessage(message, type = "error") {
                messageBox.textContent = message;
                messageBox.classList.remove("hidden");

                if (type === "success") {
                    messageBox.className = "mb-md p-sm rounded border text-sm bg-green-50 text-green-700 border-green-300";
                } else {
                    messageBox.className = "mb-md p-sm rounded border text-sm bg-red-50 text-red-700 border-red-300";
                }
            }

            /* Helper function to disable/enable submit button while sending request */
            function setLoading(isLoading) {
                submitBtn.disabled = isLoading;
                submitBtn.classList.toggle("opacity-60", isLoading);
                submitBtn.classList.toggle("cursor-not-allowed", isLoading);
                submitText.textContent = isLoading ? "Creating account..." : "Create account";
            }

            /* Main form submission logic */
            registerForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                const full_name = fullNameInput.value.trim();
                const email = emailInput.value.trim().toLowerCase();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                const role = roleInput.value;

                /* Basic frontend validation before sending data to backend */
                if (!full_name || !email || !password || !confirmPassword) {
                    showMessage("Please fill in all required fields.");
                    return;
                }

                if (password.length < 8) {
                    showMessage("Password must be at least 8 characters long.");
                    return;
                }

                if (password !== confirmPassword) {
                    showMessage("Passwords do not match.");
                    return;
                }

                if (role !== "student" && role !== "admin") {
                    showMessage("Invalid role selected.");
                    return;
                }

                /*
                    This payload matches what the backend should receive.
                    The backend will handle hashing the password and storing the user in the database.
                */
                const payload = {
                    full_name: full_name,
                    email: email,
                    password: password,
                    role: role
                };

                try {
                    setLoading(true);

                    const response = await fetch(`${API_BASE_URL}/auth/register`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        /* FastAPI often returns errors in data.detail */
                        const errorMessage = data.detail || "Registration failed. Please try again.";
                        showMessage(errorMessage);
                        return;
                    }

                    showMessage("Account created successfully. Redirecting to login...", "success");
                    registerForm.reset();

                    /* Redirect after successful registration */
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);

                } catch (error) {
                    showMessage("Cannot connect to the server. Please ensure FastAPI is running.");
                } finally {
                    setLoading(false);
                }
            });
        });
    </script>
</body>
</html>
